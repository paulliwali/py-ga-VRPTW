[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ga-vrpmv"
version = "0.2.0"
description = "Genetic Algorithm solution for Vehicle Routing Problem with Movement Synchronization (VRPMV / VRPMS)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Paul Deng" }
]
dependencies = [
    "deap>=1.4.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
include = ["gavrptw*", "gatspmv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
